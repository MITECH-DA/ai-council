<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AI 자문위원회 회의</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --navy:#1E2733; --navy2:#293544; --paper:#FAF7F0; --ink:#2A2823;
    --biz:#B0742C; --biz-bg:#FBF0DF; --biz-tx:#7A4E15;
    --strat:#4A4A9E; --strat-bg:#ECEBF8; --strat-tx:#34346F;
    --pe:#9C3565; --pe-bg:#FAE9F0; --pe-tx:#6E2547;
    --fin:#166F5C; --fin-bg:#E3F3EE; --fin-tx:#0F4E40;
    --law:#2C5C93; --law-bg:#E6EFF9; --law-tx:#1E4370;
    --oi:#4C7A2E; --oi-bg:#EEF5E7; --oi-tx:#365821;
    --net:#1E7A8C; --net-bg:#E5F3F5; --net-tx:#155763;
    --risk:#B03A2E; --risk-bg:#FBEBE8; --risk-tx:#7E2A21;
    --mod:#5B4A8A; --mod-bg:#EFEBF7; --mod-tx:#40315F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--navy);font-family:'Noto Sans KR',sans-serif;color:#EDEAE1;padding:0;}
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 60px;}
  .title{font-family:'Noto Serif KR',serif;font-weight:700;font-size:24px;color:#F4F1E8;margin:0 0 4px;}
  .subtitle{font-size:13px;color:#9BA3AF;margin:0 0 28px;}
  .panel{background:var(--navy2);border:1px solid #3A4453;border-radius:10px;padding:20px;margin-bottom:20px;}
  label{display:block;font-size:12px;color:#9BA3AF;margin-bottom:6px;}
  textarea{width:100%;min-height:64px;background:#151C25;border:1px solid #3A4453;border-radius:6px;color:#F4F1E8;padding:10px 12px;font-size:14px;font-family:inherit;resize:vertical;}
  textarea:focus{outline:1px solid #6B7B93;}
  .row{display:flex;gap:12px;margin-top:14px;align-items:flex-end;}
  select{background:#151C25;border:1px solid #3A4453;color:#F4F1E8;padding:8px 10px;border-radius:6px;font-size:13px;}
  button{background:#E8A64B;color:#241704;border:none;border-radius:6px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;}
  button:disabled{background:#5A5346;color:#9B9385;cursor:not-allowed;}
  button:hover:not(:disabled){background:#F0B563;}

  .seats-title{font-size:12px;color:#9BA3AF;margin:0 0 10px;}
  .seats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
  .seat{background:var(--navy2);border:1px solid #3A4453;border-radius:8px;padding:10px 6px 8px;text-align:center;font-size:11px;color:#9BA3AF;transition:all .25s;position:relative;}
  .seat.off{opacity:.4;}
  .seat .role{font-weight:700;font-size:12px;display:block;margin-bottom:2px;color:#EDEAE1;}
  .seat.active{border-color:currentColor;box-shadow:0 0 0 1px currentColor inset;}
  .seat.biz.active{color:var(--biz);} .seat.fin.active{color:var(--fin);}
  .seat.law.active{color:var(--law);} .seat.risk.active{color:var(--risk);}
  .seat.strat.active{color:var(--strat);} .seat.pe.active{color:var(--pe);}
  .seat.oi.active{color:var(--oi);} .seat.net.active{color:var(--net);}
  .seat .status{display:block;margin-top:3px;font-size:10px;}
  .seat .chk{margin-top:6px;}
  .seat .chk input{cursor:pointer;}

  .minutes{background:var(--paper);border-radius:10px;padding:24px 26px;color:var(--ink);min-height:80px;}
  .minutes-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px;}
  .minutes-head h2{font-family:'Noto Serif KR',serif;font-size:17px;margin:0;}
  .minutes-head span{font-size:11px;color:#6B675B;}
  .empty{font-size:13px;color:#8A8579;font-style:normal;}
  .entry{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #E3DFD3;}
  .entry:last-child{border-bottom:none;}
  .entry .who{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:6px;}
  .who.biz{background:var(--biz-bg);color:var(--biz-tx);}
  .who.fin{background:var(--fin-bg);color:var(--fin-tx);}
  .who.law{background:var(--law-bg);color:var(--law-tx);}
  .who.risk{background:var(--risk-bg);color:var(--risk-tx);}
  .who.strat{background:var(--strat-bg);color:var(--strat-tx);}
  .who.pe{background:var(--pe-bg);color:var(--pe-tx);}
  .who.oi{background:var(--oi-bg);color:var(--oi-tx);}
  .who.net{background:var(--net-bg);color:var(--net-tx);}
  .who.mod{background:var(--mod-bg);color:var(--mod-tx);}
  .entry p{font-size:14px;line-height:1.65;margin:0;white-space:pre-wrap;}
  .typing{font-size:13px;color:#8A8579;}
  .typing::after{content:'●●●';letter-spacing:2px;animation:blink 1.2s infinite;}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

  .stamp{display:inline-block;border:2px solid var(--risk);color:var(--risk);font-weight:700;font-size:13px;padding:5px 12px;border-radius:4px;transform:rotate(-4deg);margin-top:10px;font-family:'Noto Serif KR',serif;}
  .err{color:#F3B3AC;font-size:13px;margin-top:10px;}
  #exportBtn{background:transparent;border:1px solid var(--ink);color:var(--ink);font-weight:500;}
  #exportBtn:disabled{border-color:#C9C4B5;color:#B0AB9C;background:transparent;}
  #exportBtn:hover:not(:disabled){background:var(--ink);color:var(--paper);}
  #fileInput{color:#EDEAE1;font-size:12px;}
  input[type=range]{accent-color:#E8A64B;}

  .resume-link{display:block;margin-top:6px;background:transparent;border:none;color:#7A8290;font-size:10px;text-decoration:underline;cursor:pointer;padding:0;font-family:inherit;}
  .resume-link:hover{color:#E8A64B;}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,14,20,.78);z-index:80;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal-card{background:var(--paper);color:var(--ink);max-width:640px;width:100%;max-height:86vh;overflow-y:auto;border-radius:12px;padding:30px 32px;position:relative;}
  .modal-close{position:absolute;top:14px;right:16px;background:transparent;border:none;font-size:22px;line-height:1;color:#8A8579;cursor:pointer;padding:4px 8px;}
  .modal-close:hover{color:var(--ink);}
  .resume-head{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:18px;}
  .resume-head .who{margin-bottom:10px;}
  .resume-name{font-family:'Noto Serif KR',serif;font-size:21px;margin:0 0 2px;}
  .resume-title{font-size:13px;color:#6B675B;margin:0 0 8px;}
  .resume-oneline{font-size:14px;font-style:italic;color:#4A4536;margin:0;}
  .resume-section{margin-top:20px;}
  .resume-section h4{font-family:'Noto Serif KR',serif;font-weight:700;font-size:14px;margin:0 0 10px;padding-bottom:5px;border-bottom:1px solid #E3DFD3;}
  .resume-section p{font-size:13px;line-height:1.7;margin:0;color:#4A4536;}
  .career-item{margin-bottom:14px;}
  .career-item:last-child{margin-bottom:0;}
  .career-item .role-period{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .career-item .role-period .org{font-weight:400;color:#8A8579;}
  .career-item ul{margin:0;padding-left:18px;}
  .career-item li{font-size:12.5px;line-height:1.65;margin-bottom:3px;color:#4A4536;}
  .track-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:2px;}
  .track-table td{padding:6px 4px;border-bottom:1px solid #E3DFD3;}
  .track-table td:first-child{color:#6B675B;}
  .track-table td:last-child{font-weight:700;text-align:right;white-space:nowrap;padding-left:12px;}
  .philosophy-list{margin:0;padding-left:18px;}
  .philosophy-list li{font-size:13px;line-height:1.75;margin-bottom:8px;font-style:italic;color:#4A4536;}
  .sample-quote{background:#F0ECDF;border-left:3px solid var(--ink);padding:12px 16px;font-size:13px;line-height:1.7;border-radius:0 6px 6px 0;color:#3A3628;}
</style>
</head>
<body>
<div class="wrap">
  <p class="title">AI 자문위원회</p>
  <p class="subtitle">참석자를 선택하고 안건을 입력하면 순서대로 토론합니다</p>

  <div class="panel">
    <label for="apiKey">Claude API 키</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." style="width:100%;background:#151C25;border:1px solid #3A4453;border-radius:6px;color:#F4F1E8;padding:9px 12px;font-size:13px;font-family:inherit;">
    <p style="font-size:11px;color:#9BA3AF;margin:6px 0 0;">이 브라우저의 localStorage에만 저장됩니다. 공용 컴퓨터나 공개 URL에서는 입력하지 마세요.</p>
  </div>

  <div class="panel">
    <label for="agenda">회의 안건</label>
    <textarea id="agenda" placeholder="예: 신규 해외 유통사와 총판 계약 체결 여부를 검토한다"></textarea>
    <div class="row">
      <div>
        <label for="rounds">발언 강도: 참석자당 평균 <span id="roundsVal">2</span>회 (총 <span id="totalTurnsHint">-</span>턴)</label>
        <input type="range" id="rounds" min="1" max="10" value="2" step="1" style="width:220px;" oninput="updateRoundsLabel()">
      </div>
      <button id="startBtn" onclick="startMeeting()">회의 시작</button>
    </div>
  </div>

  <div class="panel">
    <label for="fileInput">참고 자료 (이미지 / PDF / Word / Excel / PowerPoint / 텍스트, 선택)</label>
    <input type="file" id="fileInput" multiple accept="image/*,.pdf,.txt,.md,.csv,.docx,.xlsx,.xls,.pptx" onchange="handleFiles(event)">
    <div id="fileList" style="margin-top:8px;"></div>
    <p style="font-size:11px;color:#9BA3AF;margin:8px 0 0;">Word·Excel·PowerPoint는 브라우저에서 텍스트만 추출되며(서식 제외), 첨부 내용은 매 발언마다 참석자 전원에게 다시 전달됩니다. 이미지·PDF는 토큰 소모가 크므로 합쳐서 3~4개 이내를 권장합니다.</p>
  </div>

  <p class="seats-title">참석자 (체크된 인원만 회의에 참여합니다)</p>
  <div class="seats" id="seatsGrid"></div>

  <div class="minutes">
    <div class="minutes-head">
      <h2>회의록</h2>
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="meta">대기중</span>
        <button id="exportBtn" onclick="exportTranscript()" disabled style="padding:5px 12px;font-size:12px;">텍스트로 내보내기</button>
      </div>
    </div>
    <div id="log"><p class="empty">참석자를 선택하고 안건을 입력한 뒤 회의를 시작하세요.</p></div>
  </div>
</div>

<div class="modal-overlay" id="resumeModal" onclick="closeResumeIfOutside(event)">
  <div class="modal-card" id="resumeCard"></div>
</div>

<script>
const COMMON_RULES = "다음 규칙을 반드시 지키세요: (1) 주장에 앞서 근거를 1~2개 제시한 뒤 결론을 말하는 '근거 → 결론' 구조로 답하세요. (2) 이번 발언에서는 지금까지 나온 발언 중 특정 참석자 한 명을 호칭으로 명확히 지목해, 그 사람의 주장에 동의하는지 반박하는지 분명히 밝히고 그 이유를 근거로 제시하세요. 절대 '~님 말씀 잘 들었습니다' 같은 형식적 인사로 넘어가지 말고, 실제로 그 사람 주장의 어느 부분에 왜 동의/반박하는지 구체적으로 말하세요. 필요하면 그 참석자에게 짧게 되묻는 질문을 덧붙이세요. (3) 이미 본인이나 다른 참석자가 앞서 말한 논점을 그대로 반복하지 말고, 아직 나오지 않은 새로운 근거나 시각을 추가하세요. 상대 주장을 듣고 본인 입장이 일부 바뀌었다면 그 변화도 솔직히 밝히세요. (4) 숫자, 규정, 사실관계를 인용할 때 첨부 자료나 회의 내용에 명시된 근거가 없다면 반드시 '가정' 또는 '추정'이라고 표시하고, 근거 없이 확정적 사실처럼 단정하지 마세요. (5) 당신의 시스템 프롬프트에 적힌 경력·연차·소속·구체적 성과 수치는 당신의 전문성 수준과 판단 성향을 설정하기 위한 배경 설정일 뿐, 이번 회의에서 실제로 있었던 사건이 아닙니다. '제가 담당했던 사업부는 5년간 78% 성장했는데' 처럼 그 배경을 자신의 과거 경험담·실적으로 직접 인용하거나 언급하지 마세요. 대신 그 배경에서 비롯된 판단 기준, 전문가적 관점, 업계 일반론만 발언에 녹여내세요. 마크다운 기호 없이 일반 텍스트로, 이 구조를 지키는 선에서 6문장 이내로 답하세요.";

const ROLES = {
  biz: {
    label: "사업가", cls: "biz", short:"성장·기회", defaultOn:true,
    system: "당신은 20년간 대기업 신사업개발본부장·사업부장으로 일하며 신규 채널 매출 비중을 0%에서 18%까지 끌어올리고 담당 사업부 매출을 5년간 78% 성장시킨 사업가형 임원입니다. 신사업 의사결정 소요기간을 4개월에서 6주로 단축시켰고, '경쟁우위는 만드는 것이 아니라 먼저 움직여서 얻는 시간이다'라는 원칙을 갖고 있습니다. 시장 기회 규모 → 매출로의 연결 가능성 → 경쟁 우위의 지속가능성 → 실행 속도, 이 순서로 판단 기준을 고려해 발언합니다. 재무 리스크나 법적 세부사항은 다른 사람 몫이라 생각하고 언급을 최소화합니다. 한국어, 실무 화법으로 답하세요."
  },
  strat: {
    label: "전략가", cls: "strat", short:"글로벌 전략펌 출신", defaultOn:false,
    system: "당신은 19년간 글로벌 전략컨설팅펌 컨설턴트와 대기업 전략기획실장으로 일하며 중장기(5개년) 포트폴리오 전략을 3회 수립하고, 정합성 기준 미달을 이유로 신사업 제안의 60%를 반려시킨 전략가형 임원입니다. 전략적 부적합을 이유로 M&A 딜 5건을 사전에 배제한 경험이 있으며, '할 수 있다고 다 해야 하는 건 아니다, 핵심역량과 멀어지는 성장은 성장이 아니라 분산이다'라는 원칙을 갖고 있습니다. 문제 정의 → 전략적 옵션 도출(최소 2개) → 옵션 간 트레이드오프 비교 → 기존 포트폴리오·핵심역량과의 정합성, 이 순서로 사고해 발언합니다. 최소 하나의 전략적 대안(예: A안 vs B안)을 구조화해서 제시하세요. 한국어, 논리적이고 구조화된 화법으로 답하세요."
  },
  pe: {
    label: "사모펀드 M&A 담당", cls: "pe", short:"딜 구조·밸류에이션", defaultOn:false,
    system: "당신은 15년간 사모펀드 파트너와 대기업 PE·M&A본부장으로 일하며 20건 이상, 누적 1조원 이상의 인수 딜을 실행하고 그중 75%가 목표 IRR 18% 이상을 달성한 딜메이커형 임원입니다. 매각 시 장부가 대비 평균 22% 프리미엄을 확보했고, '엑싯 경로가 안 보이는 투자는 투자가 아니라 매몰이다, 들어가기 전에 나가는 길부터 그려야 한다'는 원칙을 갖고 있습니다. 밸류에이션 적정성 → 딜 구조 리스크(지분/자산 인수, 마일스톤 페이아웃 등) → 엑싯 시나리오, 이 순서로 판단 기준을 고려해 발언합니다. 가능하면 구체적인 딜 구조 대안이나 밸류에이션 논리를 1개 제시하세요. 한국어, 냉철하고 거래 중심적인 화법으로 답하세요."
  },
  fin: {
    label: "재무전문가", cls: "fin", short:"수익·비용", defaultOn:true,
    system: "당신은 17년간 투자은행 애널리스트와 대기업 재무전략실장으로 일하며 M&A 협상에서 평균 12% 가격 조정을 관철시키고, 투자 승인 프로젝트의 손실률을 35%에서 12%로 낮춘 재무 전문가입니다. 저성과 프로젝트 조기 중단으로 연 200억 규모 매몰비용을 방지했고, '매출은 허영 지표가 될 수 있다, 이익과 현금흐름만이 진짜 성적표다'라는 원칙을 갖고 있습니다. 현금흐름 영향 → 손익분기(BEP) 도달 시점 → 이익률에 대한 영향 → 기회비용, 이 순서로 판단 기준을 고려해 발언합니다. 숫자나 구체적 재무 논리를 최소 1개 언급하세요. 한국어, 보수적이고 신중한 화법으로 답하세요."
  },

let attachments = [];

function readFileAsBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = () => reject(new Error('파일 읽기 실패'));
    r.readAsDataURL(file);
  });
}
function readFileAsText(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('파일 읽기 실패'));
    r.readAsText(file);
  });
}

function readFileAsArrayBuffer(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('파일 읽기 실패'));
    r.readAsArrayBuffer(file);
  });
}

async function extractDocxText(file){
  const buf = await readFileAsArrayBuffer(file);
  const result = await mammoth.extractRawText({arrayBuffer: buf});
  return result.value;
}

async function extractXlsxText(file){
  const buf = await readFileAsArrayBuffer(file);
  const wb = XLSX.read(buf, {type:'array'});
  let out = '';
  wb.SheetNames.forEach(name => {
    out += `\n[시트: ${name}]\n` + XLSX.utils.sheet_to_csv(wb.Sheets[name]);
  });
  return out;
}

async function extractPptxText(file){
  const buf = await readFileAsArrayBuffer(file);
  const zip = await JSZip.loadAsync(buf);
  const slideFiles = Object.keys(zip.files)
    .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a,b) => parseInt(a.match(/slide(\d+)\.xml/)[1]) - parseInt(b.match(/slide(\d+)\.xml/)[1]));
  let out = '';
  for(let i=0; i<slideFiles.length; i++){
    const xml = await zip.files[slideFiles[i]].async('text');
    const texts = [...xml.matchAll(/<a:t>(.*?)<\/a:t>/g)].map(m => m[1]);
    out += `\n[슬라이드 ${i+1}]\n` + texts.join(' ');
  }
  return out;
}

async function handleFiles(e){
  const files = Array.from(e.target.files);
  for(const f of files){
    try{
      if(f.type.startsWith('image/')){
        const data = await readFileAsBase64(f);
        attachments.push({name:f.name, kind:'image', mediaType:f.type, data});
      }else if(f.type === 'application/pdf' || /\.pdf$/i.test(f.name)){
        const data = await readFileAsBase64(f);
        attachments.push({name:f.name, kind:'pdf', mediaType:'application/pdf', data});
      }else if(/\.docx$/i.test(f.name)){
        const text = await extractDocxText(f);
        attachments.push({name:f.name, kind:'text', data:text.slice(0,8000)});
      }else if(/\.(xlsx|xls)$/i.test(f.name)){
        const text = await extractXlsxText(f);
        attachments.push({name:f.name, kind:'text', data:text.slice(0,8000)});
      }else if(/\.pptx$/i.test(f.name)){
        const text = await extractPptxText(f);
        attachments.push({name:f.name, kind:'text', data:text.slice(0,8000)});
      }else if(f.type.startsWith('text/') || /\.(txt|md|csv)$/i.test(f.name)){
        const text = await readFileAsText(f);
        attachments.push({name:f.name, kind:'text', data:text.slice(0,8000)});
      }else{
        alert(`${f.name}: 지원하지 않는 형식입니다. 이미지, PDF, Word(.docx), Excel(.xlsx/.xls), PowerPoint(.pptx), 텍스트(txt/md/csv) 파일만 첨부할 수 있습니다.`);
      }
    }catch(err){
      alert(`${f.name} 읽기 실패: ${err.message}`);
    }
  }
  e.target.value = '';
  renderFileList();
}

function removeAttachment(idx){

function renderFileList(){

  }).join('');

function buildMediaBlocks(){
  return attachments.filter(a => a.kind==='image' || a.kind==='pdf').map(a => {
    if(a.kind==='image'){
      return {type:'image', source:{type:'base64', media_type:a.mediaType, data:a.data}};
    }
    return {type:'document', source:{type:'base64', media_type:'application/pdf', data:a.data}};
  });
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function mdToHtml(raw){
  let s = escapeHtml(raw);
  s = s.replace(/^#{2,4}\s*(.*)$/gm, '<strong style="display:block;margin-top:10px;">$1</strong>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/^---$/gm, '');
  return s;
}

async function callAgent(system, transcriptText, maxTokens, mediaBlocks, temperature){
  const apiKey = localStorage.getItem('claude_api_key') || '';
  if(!apiKey){ throw new Error('API 키를 먼저 입력해 주세요.'); }
  const content = (mediaBlocks && mediaBlocks.length)
    ? [...mediaBlocks, {type:'text', text: transcriptText}]
    : transcriptText;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type":"application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: maxTokens || 700,
      temperature: (typeof temperature === 'number') ? temperature : 0.5,
      system: system,
      messages: [{role:"user", content: content}]
    })
  });
  if(!res.ok){
    const errBody = await res.text();
    throw new Error(`API 오류 (${res.status}): ${errBody.slice(0,200)}`);
  }
  const data = await res.json();
  if(data.content && data.content.length){
    return data.content.map(b=>b.text||"").join("").trim();
  }
  throw new Error("empty response");
}

async function pickNextSpeaker(candidateKeys, historyArr, mediaBlocks){
  const roster = candidateKeys.map(k => `${k}: ${ROLES[k].label} (${ROLES[k].short})`).join('\n');
  const dispatchSystem = `당신은 회의 진행자입니다. 아래 후보자 목록 중, 지금까지의 회의 흐름과 가장 최근 발언 내용에 가장 적합하게 답하거나 반박할 수 있는 사람 한 명을 고르세요. 반드시 후보자 코드(콜론 왼쪽 영문)만 정확히 한 단어로 출력하세요. 설명이나 다른 텍스트는 절대 쓰지 마세요.\n\n후보자 목록:\n${roster}`;
  try{
    const text = await callAgent(dispatchSystem, historyArr.join('\n\n') + '\n\n---\n다음 발언자로 가장 적합한 사람의 코드만 출력하세요.', 20, null, 0.3);
    const cleaned = text.trim().toLowerCase().replace(/[^a-z]/g, '');
    if(candidateKeys.includes(cleaned)) return cleaned;
    const found = candidateKeys.find(k => cleaned.includes(k) || k.includes(cleaned));
    if(found) return found;
  }catch(e){
    // 디스패처 실패 시 후보 중 무작위 선택으로 폴백
  }
  return candidateKeys[Math.floor(Math.random() * candidateKeys.length)];
}

  if(!apiKeyInput.value.trim()){ alert('Claude API 키를 입력해 주세요.'); return; }

  activeOrder = FULL_ORDER.filter(key => document.getElementById('chk-'+key).checked);
  if(activeOrder.length < 2){ alert('참석자를 최소 2명 이상 선택해 주세요.'); return; }

  const rounds = parseInt(document.getElementById('rounds').value, 10);
  const btn = document.getElementById('startBtn');
  btn.disabled = true; btn.textContent = '진행중...';
  document.getElementById('exportBtn').disabled = true;
  document.getElementById('log').innerHTML = '';
  document.getElementById('meta').textContent = '진행중';
  history = [`[안건] ${agenda}`];
  attachments.filter(a => a.kind === 'text').forEach(a => {
    history.push(`[첨부 문서: ${a.name}]\n${a.data}`);
  });
  const mediaBlocks = buildMediaBlocks();
  currentAgenda = agenda;
  currentRounds = rounds;
  moderatorSummary = '';
  resetSeats();

  try{
    let lastIssue = '';
    let lastSpeaker = null;
    const speakerHistory = [];
    const spoken = {};
    activeOrder.forEach(k => spoken[k] = 0);
    const totalTurns = rounds * activeOrder.length;
    const issueEvery = activeOrder.length; // 참석자 수 한 바퀴마다 쟁점 정리

    for(let t=1; t<=totalTurns; t++){
      const unspoken = activeOrder.filter(k => spoken[k] === 0);
      const remaining = totalTurns - t + 1;
      let candidates;
      if(unspoken.length > 0 && unspoken.length >= remaining){
        candidates = unspoken; // 막판에는 아직 발언 안 한 사람만 선택 가능
      }else{
        const minSpoken = Math.min(...activeOrder.map(k => spoken[k]));
        const fairPool = activeOrder.filter(k => spoken[k] <= minSpoken + 1); // 발언 횟수 균형 유지
        const recentSet = new Set(speakerHistory.slice(-2)); // 최근 2명 제외해서 핑퐁 방지
        const noRecent = fairPool.filter(k => !recentSet.has(k));
        candidates = noRecent.length > 0 ? noRecent : fairPool;
      }
      if(candidates.length > 1 && lastSpeaker){
        const filtered = candidates.filter(k => k !== lastSpeaker);
        if(filtered.length > 0) candidates = filtered;
      }

      const nextKey = candidates.length === 1 ? candidates[0] : await pickNextSpeaker(candidates, history, mediaBlocks);
      const role = ROLES[nextKey];

      setSeat(nextKey, '발언중', true);
      const entryDiv = appendEntry(role.cls, `${role.label} · ${t}번째 발언`, '', true);
      const issueLine = lastIssue ? `\n\n[사회자가 짚은 쟁점] ${lastIssue}\n위 쟁점에 대한 당신의 입장을 우선적으로 다루세요.` : '';
      const transcript = history.join('\n\n') + issueLine + `\n\n---\n지금까지의 회의 내용을 참고하여 발언하세요. 첨부된 이미지나 문서가 있다면 그 내용을 근거로 활용하세요. 반드시 완결된 문장으로 끝내세요.`;
      const text = await callAgent(role.system + ' ' + COMMON_RULES, transcript, 800, mediaBlocks, 0.5);
      entryDiv.innerHTML = `<span class="who ${role.cls}">${role.label} · ${t}번째 발언</span><p>${mdToHtml(text)}</p>`;
      history.push(`[${role.label}] ${text}`);
      spoken[nextKey]++;
      lastSpeaker = nextKey;
      speakerHistory.push(nextKey);
      setSeat(nextKey, '완료', false);

      if(t % issueEvery === 0 && t < totalTurns){
        resetSeats();
        document.getElementById('meta').textContent = '쟁점 정리중';
        const issueDiv = appendEntry('mod', '사회자 · 쟁점 포착', '', true);
        const issueSystem = "당신은 회의 사회자입니다. 지금까지 나온 발언들 중 참석자들 사이에 가장 첨예하게 의견이 갈리는 쟁점 하나를 골라, 어느 참석자와 어느 참석자가 왜 부딪히는지 구체적으로 짚어 1~2문장으로 요약하세요. 마크다운 기호 없이 일반 텍스트로, 한국어로 답하세요.";
        const issueText = await callAgent(issueSystem, history.join('\n\n') + '\n\n---\n지금까지 회의에서 가장 의견이 갈리는 쟁점을 짚어주세요.', 300, mediaBlocks, 0.4);
        issueDiv.innerHTML = `<span class="who mod">사회자 · 쟁점 포착</span><p>${mdToHtml(issueText)}</p>`;
        history.push(`[사회자 - 쟁점] ${issueText}`);
        lastIssue = issueText;
        document.getElementById('meta').textContent = '진행중';
      }
    }

    resetSeats();
    document.getElementById('meta').textContent = '요약 작성중';
    const modDiv = appendEntry('mod', '사회자 종합', '', true);
    const roleList = activeOrder.map(k=>ROLES[k].label).join('/');
    const modSystem = `당신은 회의 사회자입니다. 지금까지 참석한 ${activeOrder.length}명(${roleList})의 발언을 종합해 (1) 각 참석자의 핵심 입장 한 줄씩, (2) 의견이 갈리는 지점 최대 2가지, (3) 근거를 함께 제시한 사회자로서의 종합 권고안 순서로 정리하세요. 권고안 중 회의에서 명시적으로 확인되지 않은 가정에 기반한 부분은 '가정'이라고 표시하세요. 마크다운 기호(#, **, 번호 매기기)는 쓰지 말고 일반 텍스트로만 작성하세요. 각 항목은 2문장 이내로 간결하게 쓰고, 전체 응답은 참석 인원 수에 비례해 늘려도 되지만 항목당 분량은 넘기지 마세요. 한국어로, 반드시 (3) 종합 권고안까지 완결된 문장으로 마무리하세요.`;
    const modText = await callAgent(modSystem, history.join('\n\n') + '\n\n---\n위 회의 내용을 종합 정리하세요.', 2200, mediaBlocks, 0.4);
    modDiv.innerHTML = `<span class="who mod">사회자 종합</span><p>${mdToHtml(modText)}</p><span class="stamp">회의 종료</span>`;
    moderatorSummary = modText;
    document.getElementById('meta').textContent = '종료';
    document.getElementById('exportBtn').disabled = false;

  }catch(err){
    appendEntry('risk','오류','', false);
    document.getElementById('log').lastChild.querySelector('p').innerHTML = '<span class="err">API 호출 중 오류가 발생했습니다: '+escapeHtml(err.message||String(err))+'</span>';
  }finally{
    btn.disabled = false; btn.textContent = '회의 시작';
  }
}

function exportTranscript(){
  if(!history.length) return;
  const now = new Date();
  const ts = now.toISOString().slice(0,16).replace('T',' ');
  const lines = [];
  lines.push('AI 자문위원회 회의록');
  lines.push(`일시: ${ts}`);
  lines.push(`발언 강도: 참석자당 평균 ${currentRounds}회`);
  lines.push(`참석자: ${activeOrder.map(k=>ROLES[k].label).join(', ')}`);
  if(attachments.length){
    lines.push(`첨부파일: ${attachments.map(a=>a.name).join(', ')}`);
  }
  lines.push(`안건: ${currentAgenda}`);
  lines.push('='.repeat(40));
  lines.push('');
  history.slice(1).forEach(line => { lines.push(line); lines.push(''); });
  if(moderatorSummary){
    lines.push('-'.repeat(40));
    lines.push('[사회자 종합]');
    lines.push(moderatorSummary);
  }
  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeAgenda = currentAgenda.slice(0,20).replace(/[\\/:*?"<>|]/g,'');
  a.href = url;
  a.download = `회의록_${safeAgenda}_${now.toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
